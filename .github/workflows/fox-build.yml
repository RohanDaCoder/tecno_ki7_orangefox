name: Build OrangeFox R12.1

# CI for the TECNO Spark 10 Pro (KI7) recovery device tree.
#
#  * Every push to Fox_12.1 / main (or a manual run) builds the recovery
#    image and stores it as a workflow *artifact* (30 day retention).
#  * Pushing a tag whose name starts with "v" (e.g. v1.0) additionally
#    publishes a full GitHub *Release* with the image, md5 and bundle zip.
#
#  Maintainer: RohanDaCoder <https://github.com/RohanDaCoder>

on:
  push:
    branches: [ Fox_12.1, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases on v* tags

concurrency:
  group: fox-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OrangeFox R12.1 for TECNO Spark 10 Pro (KI7)
    # PINNED to 22.04 on purpose: AOSP 12.1 does not build on 24.04
    # (Python 3.12 / missing libtinfo5 / OpenSSL 3 breakage).
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Check out the device tree
        uses: actions/checkout@v4

      - name: Maximize disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache \
                       /usr/local/julia* /opt/az /opt/hiredis 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5-dev libncursesw5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig \
            libssl-dev rsync python3 python3-pip bc lzop patch cpio
          # compat libs (present on 22.04, may vanish on newer runners)
          sudo apt-get install -y -qq libtinfo5 libncurses5 2>/dev/null \
            || echo "::warning::libtinfo5/libncurses5 unavailable - continuing"
          # repo tool
          sudo curl -sSL https://storage.googleapis.com/git-repo-downloads/repo \
               -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
          # git identity (repo init + any git operations)
          git config --global user.name  "RohanDaCoder"
          git config --global user.email "102975537+RohanDaCoder@users.noreply.github.com"
          repo version

      - name: Add swap file (OOM safety)
        run: |
          if sudo fallocate -l 10G /mnt/fox-swap 2>/dev/null; then
            sudo chmod 600 /mnt/fox-swap
            sudo mkswap /mnt/fox-swap >/dev/null
            sudo swapon /mnt/fox-swap || true
            echo "swap enabled on /mnt"
          else
            echo "::warning::could not create swap - continuing without it"
          fi
          free -h

      # The official OrangeFox sync script (non-interactive with --branch and
      # --path). For 12.1 it repo-inits the minimal TWRP AOSP manifest
      # (twrp-12.1), patches the build system for OrangeFox and clones the
      # OrangeFox recovery + vendor trees on top of it.
      - name: Sync OrangeFox R12.1 sources
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/OrangeFox_sync"
          cd "$HOME/OrangeFox_sync"
          ./orangefox_sync.sh --branch 12.1 --path "$HOME/fox_12.1"
          df -h /
          du -sh "$HOME/fox_12.1" || true

      - name: Install the KI7 device tree
        run: |
          rm -rf "$HOME/fox_12.1/device/tecno/KI7"
          mkdir -p "$HOME/fox_12.1/device/tecno"
          cp -a "$GITHUB_WORKSPACE" "$HOME/fox_12.1/device/tecno/KI7"
          rm -rf "$HOME/fox_12.1/device/tecno/KI7/.git"
          ls -la "$HOME/fox_12.1/device/tecno/KI7"

      - name: Build OrangeFox (recovery-as-boot, virtual A/B)
        run: |
          cd "$HOME/fox_12.1"
          export LC_ALL="C"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="KI7"
          source build/envsetup.sh
          source device/tecno/KI7/vendorsetup.sh KI7
          lunch twrp_KI7-eng
          # KI7 is a virtual A/B device with no dedicated recovery partition
          # (BOARD_USES_RECOVERY_AS_BOOT) - per the OrangeFox wiki the image
          # is built with the bootimage target and lands in boot.img.
          mka adbd bootimage
          echo "---- build output ----"
          ls -la out/target/product/KI7/*.img

      - name: Collect the recovery image
        run: |
          set -euo pipefail
          OUT="$HOME/fox_12.1/out/target/product/KI7"
          ls -la "$OUT" || true
          cd "$OUT"
          # OrangeFox renames the image itself; fall back to boot.img
          # (recovery-as-boot) and finally recovery.img.
          IMG=""
          for f in OrangeFox-unofficial-KI7.img OrangeFox-*.img boot.img recovery.img; do
            if [ -f "$f" ]; then IMG="$f"; break; fi
          done
          if [ -z "$IMG" ]; then
            echo "::error::No recovery image found in $OUT"
            exit 1
          fi
          echo "Recovery image found: $IMG"

          STAGE="$GITHUB_WORKSPACE/release"
          mkdir -p "$STAGE"
          cp "$OUT/$IMG" "$STAGE/OrangeFox-unofficial-KI7.img"
          cd "$STAGE"
          md5sum OrangeFox-unofficial-KI7.img > OrangeFox-unofficial-KI7.img.md5
          MD5=$(awk '{print $1}' OrangeFox-unofficial-KI7.img.md5)

          SIZE=$(stat -c%s OrangeFox-unofficial-KI7.img)
          LIMIT=33554432   # stock boot_a partition = 32 MiB
          if [ "$SIZE" -gt "$LIMIT" ]; then
            SIZE_STATUS="OVERSIZED - does NOT fit the stock 32 MiB boot_a (repartition first, see README Option C)"
          else
            SIZE_STATUS="fits the stock 32 MiB boot_a partition"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_NAME="${GITHUB_REF_NAME//\//_}"
          ARTIFACT_NAME="OrangeFox-KI7-r${GITHUB_RUN_NUMBER}-${RELEASE_NAME}"
          {
            echo "SHORT_SHA=$SHORT_SHA"
            echo "RELEASE_NAME=$RELEASE_NAME"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
            echo "IMAGE_SIZE=$SIZE"
            echo "SIZE_STATUS=$SIZE_STATUS"
            echo "IMAGE_MD5=$MD5"
          } >> "$GITHUB_ENV"

          {
            echo "OrangeFox R12.1 (unofficial) for TECNO Spark 10 Pro (KI7)"
            echo "========================================================="
            echo "Build date : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Commit     : $GITHUB_SHA (ref: $RELEASE_NAME)"
            echo "Runner     : $(nproc) cores, Ubuntu 22.04"
            echo "Image      : OrangeFox-unofficial-KI7.img"
            echo "Image size : $SIZE bytes ($(numfmt --to=iec "$SIZE"))"
            echo "boot_a     : $SIZE_STATUS"
            echo "md5        : $MD5"
            echo "Maintainer : RohanDaCoder"
          } > build_info.txt

          zip -9 "${ARTIFACT_NAME}.zip" \
            OrangeFox-unofficial-KI7.img OrangeFox-unofficial-KI7.img.md5 build_info.txt
          ls -la "$STAGE"

          {
            echo "### OrangeFox R12.1 build - TECNO Spark 10 Pro (KI7)"
            echo ""
            echo "- Image: **OrangeFox-unofficial-KI7.img** - $SIZE bytes ($(numfmt --to=iec "$SIZE"))"
            echo "- 32 MiB boot_a check: $SIZE_STATUS"
            echo "- md5: $MD5"
            echo "- Commit: $SHORT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      # Normal commits: build result only goes to the workflow artifacts.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            release/OrangeFox-unofficial-KI7.img
            release/OrangeFox-unofficial-KI7.img.md5
            release/build_info.txt
            release/*.zip
          if-no-files-found: error
          retention-days: 30

      # Tags starting with "v": publish a full GitHub Release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release"
          TAG="${GITHUB_REF_NAME}"

          {
            echo "## OrangeFox R12.1 (Unofficial) - TECNO Spark 10 Pro (KI7)"
            echo ""
            echo "**Release:** $RELEASE_NAME - **Built:** $(date -u '+%Y-%m-%d %H:%M UTC') - **Commit:** $SHORT_SHA"
            echo "**Maintainer:** RohanDaCoder ([@RohanDaCoder](https://github.com/RohanDaCoder))"
            echo ""
            echo "### Image"
            echo "- File: **OrangeFox-unofficial-KI7.img** ($IMAGE_SIZE bytes - $SIZE_STATUS)"
            echo "- md5: $IMAGE_MD5"
            echo ""
            echo "### Install (KI7 is recovery-as-boot - there is NO recovery partition)"
            echo ""
            echo "1. Back up your stock boot FIRST and keep it forever:"
            echo "   adb shell su -c \"dd if=/dev/block/by-name/boot_a of=/sdcard/stock_boot_a.img\""
            echo "2. Push and flash the image to the ACTIVE slot:"
            echo "   adb push OrangeFox-unofficial-KI7.img /sdcard/fox.img"
            echo "   adb shell su -c \"dd if=/sdcard/fox.img of=/dev/block/by-name/boot_a\""
            echo "3. Reboot to recovery:"
            echo "   adb reboot recovery"
            echo "4. To return to HiOS: dd the saved stock_boot_a.img back to boot_a."
            echo ""
            echo "### Warnings"
            echo ""
            echo "- KI7's boot_a is only 32 MiB. This image $SIZE_STATUS."
            echo "- Read the repo README (flashing, asymmetric slots, repartition Option C) before touching anything."
            echo "- You are solely responsible for what you flash. Bootloader must be unlocked."
            echo ""
            echo "### Credits"
            echo ""
            echo "- Maintainer: **RohanDaCoder**"
            echo "- KH7n OrangeFox tree: isus203 / tecno-mt6768"
            echo "- twrpdtgen: SebaUbuntu - TWRP & OrangeFox teams"
          } > release_notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release for $TAG already exists - uploading assets (clobber)"
            gh release upload "$TAG" OrangeFox-unofficial-KI7.img \
              OrangeFox-unofficial-KI7.img.md5 *.zip \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OrangeFox R12.1 - TECNO Spark 10 Pro (KI7) - $TAG" \
              --notes-file release_notes.md \
              --latest \
              OrangeFox-unofficial-KI7.img OrangeFox-unofficial-KI7.img.md5 *.zip
          fi
          echo "Release $TAG published."
