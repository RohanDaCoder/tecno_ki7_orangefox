name: Build OrangeFox R12.1

# CI for the TECNO Spark 10 Pro (KI7) recovery device tree.
#
#  * Every push to Fox_12.1 / main (or a manual run) builds the recovery
#    image and stores it as a workflow *artifact* (30 day retention).
#  * Pushing a tag whose name starts with "v" (e.g. v1.0) additionally
#    publishes a full GitHub *Release* with the image, md5 and bundle zip.
#
#  Maintainer: RohanDaCoder <https://github.com/RohanDaCoder>

on:
  push:
    branches: [ Fox_12.1, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases on v* tags

concurrency:
  group: fox-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OrangeFox R12.1 for TECNO Spark 10 Pro (KI7)
    # PINNED to 22.04 on purpose: AOSP 12.1 does not build on 24.04
    # (Python 3.12 / missing libtinfo5 / OpenSSL 3 breakage).
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Check out the device tree
        uses: actions/checkout@v6

      # ccache lives INSIDE the source tree on purpose. Soong runs the ninja
      # build inside an nsjail sandbox (build/soong/ui/build/sandbox_linux.go:
      # "-R /" makes the whole rootfs READ-ONLY; only $TOP, $TOP/out and /tmp
      # are bind-mounted writable). A CCACHE_DIR under $HOME dies with
      # "Failed to create directory ...: Read-only file system".
      - name: Prepare the ccache directory
        run: mkdir -p "$HOME/fox_12.1/out/ccache"

      # Compiler cache: reuse previously compiled objects across runs.
      # GitHub's cache service is capped at 10 GB per repo, so we cache ONLY
      # ccache's store (compressed object files, capped at 8 GB below) -
      # never the ~34 GB source sync or the rest of out/ (both far over quota).
      #
      # Key strategy: unique key per commit (github.sha), so every run SAVES
      # a fresh full snapshot (also on failed builds - warm cache while
      # iterating); restore-keys picks the newest prefix match; LRU eviction
      # then keeps roughly one 8 GB entry. Device-tree or upstream changes do
      # not need key rotation: ccache is content-addressed, stale entries
      # simply miss and recompile. Exact-hit (re-run of the same commit) skips
      # the save because nothing new can be stored under the same key.
      #
      # actions/cache v6: node24 + ESM runtime (inputs unchanged since v4).
      # Requires runner >= 2.327.1 (hosted runners are far newer).
      - name: Restore compiler cache (ccache)
        id: ccache_cache
        uses: actions/cache/restore@v6
        with:
          path: ~/fox_12.1/out/ccache
          key: ccache-fox_12.1-KI7-v2-${{ github.sha }}
          restore-keys: |
            ccache-fox_12.1-KI7-v2-

      - name: Maximize disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache \
                       /usr/local/julia* /opt/az /opt/hiredis 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git gnupg flex bison build-essential zip unzip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses5-dev libncursesw5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig \
            libssl-dev rsync python3 python3-pip bc lzop patch cpio ccache zopfli
          # compat libs (present on 22.04, may vanish on newer runners)
          sudo apt-get install -y -qq libtinfo5 libncurses5 2>/dev/null \
            || echo "::warning::libtinfo5/libncurses5 unavailable - continuing"
          # repo tool
          sudo curl -sSL https://storage.googleapis.com/git-repo-downloads/repo \
               -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo
          # git identity (repo init + any git operations)
          git config --global user.name  "RohanDaCoder"
          git config --global user.email "102975537+RohanDaCoder@users.noreply.github.com"
          repo version

      - name: Add swap file (OOM safety)
        run: |
          if sudo fallocate -l 10G /mnt/fox-swap 2>/dev/null; then
            sudo chmod 600 /mnt/fox-swap
            sudo mkswap /mnt/fox-swap >/dev/null
            sudo swapon /mnt/fox-swap || true
            echo "swap enabled on /mnt"
          else
            echo "::warning::could not create swap - continuing without it"
          fi
          free -h

      # The official OrangeFox sync script (non-interactive with --branch and
      # --path). For 12.1 it repo-inits the minimal TWRP AOSP manifest
      # (twrp-12.1), patches the build system for OrangeFox and clones the
      # OrangeFox recovery + vendor trees on top of it.
      - name: Sync OrangeFox R12.1 sources
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$HOME/OrangeFox_sync"
          cd "$HOME/OrangeFox_sync"
          ./orangefox_sync.sh --branch 12.1 --path "$HOME/fox_12.1"
          df -h /
          du -sh "$HOME/fox_12.1" || true

      - name: Install the KI7 device tree
        run: |
          rm -rf "$HOME/fox_12.1/device/tecno/KI7"
          mkdir -p "$HOME/fox_12.1/device/tecno"
          cp -a "$GITHUB_WORKSPACE" "$HOME/fox_12.1/device/tecno/KI7"
          rm -rf "$HOME/fox_12.1/device/tecno/KI7/.git"
          ls -la "$HOME/fox_12.1/device/tecno/KI7"

      # Upstream OrangeFox regression (recovery tip 6bd902d1, 2026-10-26):
      # partitionmanager.cpp calls TWFunc::Create_Dir_Recursive(..., AID_MEDIA_RW, ...)
      # without including the header that defines AID_MEDIA_RW, so the build dies at
      # ~82% with "use of undeclared identifier 'AID_MEDIA_RW'".
      # In AOSP 12.1 the macro lives in
      # system/core/libcutils/include/private/android_filesystem_config.h (= 1023),
      # and that include dir IS on the recovery compile command line.
      # Patch every recovery source file that uses the macro without the include;
      # the patch is conditional and becomes a no-op once upstream fixes itself.
      - name: Patch upstream AID_MEDIA_RW regression
        shell: bash {0}
        run: |
          set -u
          cd "$HOME/fox_12.1/bootable/recovery"

          HDR="$(find "$HOME/fox_12.1/system/core" \
                 -path '*/private/android_filesystem_config.h' 2>/dev/null | head -n1)"
          if [ -n "$HDR" ]; then
            echo "AID header found: $HDR"
          else
            echo "::warning::android_filesystem_config.h not found - injecting fallback #define"
          fi

          PATCHED=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if grep -q 'android_filesystem_config' "$f"; then
              echo "ok (already has include): $f"
              continue
            fi
            echo "patching: $f"
            if [ -n "$HDR" ]; then
              sed -i '0,/^#include/ s|^#include|#include <private/android_filesystem_config.h> /* OrangeFox CI fix: AID_MEDIA_RW */\n&|' "$f"
              grep -q 'android_filesystem_config' "$f" || {
                echo "sed anchor failed on $f - prepending instead"
                sed -i '1i #include <private/android_filesystem_config.h> /* OrangeFox CI fix: AID_MEDIA_RW */' "$f"
              }
            else
              sed -i '0,/^#include/ s|^#include|#ifndef AID_MEDIA_RW\n#define AID_MEDIA_RW 1023\n#endif /* OrangeFox CI fix */\n&|' "$f"
              grep -q '#define AID_MEDIA_RW' "$f" || {
                echo "sed anchor failed on $f - prepending instead"
                sed -i '1i #ifndef AID_MEDIA_RW\n#define AID_MEDIA_RW 1023\n#endif /* OrangeFox CI fix */' "$f"
              }
            fi
            PATCHED=$((PATCHED + 1))
          done < <(grep -rl --include='*.cpp' --include='*.hpp' --include='*.h' 'AID_MEDIA_RW' .)

          echo "patched $PATCHED file(s)"
          if [ "$PATCHED" -eq 0 ]; then
            echo "nothing to patch (upstream already fixed?) - continuing"
          else
            echo "--- verification (first 3 hits) ---"
            grep -rn --include='*.cpp' --include='*.hpp' --include='*.h' \
                 -e 'android_filesystem_config' -e '#define AID_MEDIA_RW' . | head -3 || true
          fi

      - name: Build OrangeFox (recovery-as-boot, virtual A/B)
        # 'bash' WITHOUT '-e' on purpose (GitHub's default is 'bash -e'):
        # OrangeFox's patched envsetup.sh ends with a benign
        # '[ -s frameworks/base/... ] && ...' that returns 1 because the
        # minimal TWRP manifest has no frameworks/base - under 'set -e'
        # that kills the step right after the vendorsetup scan.
        # envsetup/vendorsetup also use unset vars freely, so no 'set -u'.
        # Errors are handled explicitly below instead.
        shell: bash {0}
        run: |
          cd "$HOME/fox_12.1"
          export LC_ALL="C"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="KI7"

          # ccache: reuse compiled objects from previous runs (see the
          # restore step above). CCACHE_DIR MUST stay inside the source tree:
          # soong's nsjail sandbox mounts / read-only and only $TOP/$TOP/out
          # are writable (that is what killed the first ccache attempt when
          # CCACHE_DIR was ~/.ccache-fox).
          #
          # COMPILERCHECK=content: the prebuilt clang's mtime changes on every
          # repo sync; hashing content instead keeps the cache valid across
          # syncs. SLOPPINESS: git checkouts reset header c/mtimes each sync,
          # which would otherwise look like changed headers -> 100% misses.
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/fox_12.1/out/ccache"
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR="$HOME/fox_12.1"
          export CCACHE_SLOPPINESS="file_macro,locale,time_macros,include_file_ctime,include_file_mtime"
          mkdir -p "$CCACHE_DIR"
          ccache -M 8G        # stay under GitHub's 10 GB repo cache quota
          ccache -z           # zero the counters for this run
          echo "== ccache before build =="
          ccache -s || true

          echo "== sourcing build/envsetup.sh =="
          source build/envsetup.sh

          echo "== sourcing device/tecno/KI7/vendorsetup.sh =="
          source device/tecno/KI7/vendorsetup.sh KI7

          echo "== lunch twrp_KI7-eng =="
          lunch twrp_KI7-eng
          if [ $? -ne 0 ]; then
            echo "::error::lunch twrp_KI7-eng failed"
            exit 1
          fi

          echo "== mka adbd bootimage (virtual A/B, recovery-as-boot) =="
          # KI7 has no dedicated recovery partition (BOARD_USES_RECOVERY_AS_BOOT):
          # per the OrangeFox wiki the image is built with the bootimage target
          # and lands in boot.img.
          mka adbd bootimage
          BUILD_RC=$?

          echo "== ccache after build =="
          ccache -s || true

          echo "---- build output ----"
          ls -la out/target/product/KI7/*.img || true

          if [ $BUILD_RC -ne 0 ]; then
            echo "::error::mka failed with exit code $BUILD_RC"
            exit $BUILD_RC
          fi

      # Post-build image slimming. OrangeFox R12.1's ramdisk is ~88 MiB
      # uncompressed / ~35.5 MiB gzipped - three times what the stock 32 MiB
      # boot_a can hold. The stock prebuilt kernel only decompresses
      # gzip/lz4/lzo initramfs (verified via kallsyms extraction), so xz/zstd
      # are not options; the levers are content cuts + max deflate.
      # tools/slim_bootimg.py prunes the ramdisk cpio surgically (keeping
      # uid/gid/modes of every retained file byte-identical), regenerates
      # OrangeFox's ramdisk-files.txt/.sha256sum integrity manifests, swaps
      # libandroidicu.so for a no-ICU stub and repacks with gzip -9.
      # Full audit trail of every cut (and why it is safe) in the script.
      - name: Slim the boot image to the stock 32 MiB boot_a limit
        run: |
          set -euo pipefail
          OUT="$HOME/fox_12.1/out/target/product/KI7"
          TOOLS="$GITHUB_WORKSPACE/tools"
          IMG="$OUT/boot.img"

          # 1. verify the ICU stub exports every symbol libsqlite imports
          STUB="$TOOLS/libandroidicu-stub-aarch64.so"
          nm -D --defined-only "$STUB" | awk '{print $NF}' | sort > /tmp/stub.syms
          missing=0
          for s in u_errorName_android u_foldCase_android u_isspace_android \
                   u_strToLower_android u_strToUTF8_android u_strToUpper_android \
                   ubrk_close_android ubrk_current_android ubrk_first_android \
                   ubrk_next_android ubrk_open_android ucol_close_android \
                   ucol_open_android ucol_setAttribute_android \
                   ucol_strcollIter_android ucol_strcoll_android \
                   uiter_setUTF8_android uregex_close_android \
                   uregex_matches_android uregex_open_android \
                   uregex_setText_android; do
            grep -qx "$s" /tmp/stub.syms || { echo "::error::ICU stub missing $s"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

          # 2. slim: gzip -9 first (fast); zopfli only if over the limit
          LIMIT=33484800   # stock boot_a 33,554,432 minus safety margin
          python3 "$TOOLS/slim_bootimg.py" "$IMG" "$IMG.slim" --icu-stub "$STUB"
          SIZE=$(stat -c%s "$IMG.slim")
          if [ "$SIZE" -gt "$LIMIT" ] && command -v zopfli >/dev/null 2>&1; then
            echo "gzip-9 result $SIZE > $LIMIT - retrying with zopfli"
            python3 "$TOOLS/slim_bootimg.py" "$IMG" "$IMG.slim" \
              --icu-stub "$STUB" --zopfli "$(command -v zopfli)"
            SIZE=$(stat -c%s "$IMG.slim")
          fi
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::slim image is $SIZE bytes - still over the $LIMIT limit"
            exit 1
          fi

          mv "$IMG" "$IMG.full"     # keep the pre-slim image in out/ (not uploaded)
          mv "$IMG.slim" "$IMG"
          echo "slim boot.img: $SIZE bytes ($(numfmt --to=iec "$SIZE")) - fits the stock 32 MiB boot_a"

      # Save the compiler cache even when the build FAILS - while we are
      # iterating on breakages every failed run still warms the cache for
      # the next attempt, which is the whole point. Skipped on an exact
      # key hit (re-run of the same commit, nothing new to store).
      - name: Save compiler cache (ccache)
        if: always() && steps.ccache_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/fox_12.1/out/ccache
          key: ccache-fox_12.1-KI7-v2-${{ github.sha }}

      - name: Collect the recovery image
        run: |
          set -euo pipefail
          OUT="$HOME/fox_12.1/out/target/product/KI7"
          ls -la "$OUT" || true
          cd "$OUT"
          # OrangeFox renames the image itself; fall back to boot.img
          # (recovery-as-boot) and finally recovery.img.
          IMG=""
          for f in OrangeFox-unofficial-KI7.img OrangeFox-*.img boot.img recovery.img; do
            if [ -f "$f" ]; then IMG="$f"; break; fi
          done
          if [ -z "$IMG" ]; then
            echo "::error::No recovery image found in $OUT"
            exit 1
          fi
          echo "Recovery image found: $IMG"

          STAGE="$GITHUB_WORKSPACE/release"
          mkdir -p "$STAGE"
          cp "$OUT/$IMG" "$STAGE/OrangeFox-unofficial-KI7.img"
          cd "$STAGE"
          md5sum OrangeFox-unofficial-KI7.img > OrangeFox-unofficial-KI7.img.md5
          MD5=$(awk '{print $1}' OrangeFox-unofficial-KI7.img.md5)

          SIZE=$(stat -c%s OrangeFox-unofficial-KI7.img)
          LIMIT=33554432   # stock boot_a partition = 32 MiB
          if [ "$SIZE" -gt "$LIMIT" ]; then
            SIZE_STATUS="OVERSIZED - does NOT fit the stock 32 MiB boot_a (repartition first, see README Option C)"
          else
            SIZE_STATUS="fits the stock 32 MiB boot_a partition"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_NAME="${GITHUB_REF_NAME//\//_}"
          ARTIFACT_NAME="OrangeFox-KI7-r${GITHUB_RUN_NUMBER}-${RELEASE_NAME}"
          {
            echo "SHORT_SHA=$SHORT_SHA"
            echo "RELEASE_NAME=$RELEASE_NAME"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
            echo "IMAGE_SIZE=$SIZE"
            echo "SIZE_STATUS=$SIZE_STATUS"
            echo "IMAGE_MD5=$MD5"
          } >> "$GITHUB_ENV"

          {
            echo "OrangeFox R12.1 (unofficial) for TECNO Spark 10 Pro (KI7)"
            echo "========================================================="
            echo "Build date : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Commit     : $GITHUB_SHA (ref: $RELEASE_NAME)"
            echo "Runner     : $(nproc) cores, Ubuntu 22.04"
            echo "Image      : OrangeFox-unofficial-KI7.img"
            echo "Image size : $SIZE bytes ($(numfmt --to=iec "$SIZE"))"
            echo "boot_a     : $SIZE_STATUS"
            echo "md5        : $MD5"
            echo "Maintainer : RohanDaCoder"
          } > build_info.txt

          zip -9 "${ARTIFACT_NAME}.zip" \
            OrangeFox-unofficial-KI7.img OrangeFox-unofficial-KI7.img.md5 build_info.txt
          ls -la "$STAGE"

          {
            echo "### OrangeFox R12.1 build - TECNO Spark 10 Pro (KI7)"
            echo ""
            echo "- Image: **OrangeFox-unofficial-KI7.img** - $SIZE bytes ($(numfmt --to=iec "$SIZE"))"
            echo "- 32 MiB boot_a check: $SIZE_STATUS"
            echo "- md5: $MD5"
            echo "- Commit: $SHORT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      # Normal commits: build result only goes to the workflow artifacts.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            release/OrangeFox-unofficial-KI7.img
            release/OrangeFox-unofficial-KI7.img.md5
            release/build_info.txt
            release/*.zip
          if-no-files-found: error
          retention-days: 30

      # Tags starting with "v": publish a full GitHub Release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release"
          TAG="${GITHUB_REF_NAME}"

          {
            echo "## OrangeFox R12.1 (Unofficial) - TECNO Spark 10 Pro (KI7)"
            echo ""
            echo "**Release:** $RELEASE_NAME - **Built:** $(date -u '+%Y-%m-%d %H:%M UTC') - **Commit:** $SHORT_SHA"
            echo "**Maintainer:** RohanDaCoder ([@RohanDaCoder](https://github.com/RohanDaCoder))"
            echo ""
            echo "### Image"
            echo "- File: **OrangeFox-unofficial-KI7.img** ($IMAGE_SIZE bytes - $SIZE_STATUS)"
            echo "- md5: $IMAGE_MD5"
            echo ""
            echo "### Install (KI7 is recovery-as-boot - there is NO recovery partition)"
            echo ""
            echo "1. Back up your stock boot FIRST and keep it forever:"
            echo "   adb shell su -c \"dd if=/dev/block/by-name/boot_a of=/sdcard/stock_boot_a.img\""
            echo "2. Push and flash the image to the ACTIVE slot:"
            echo "   adb push OrangeFox-unofficial-KI7.img /sdcard/fox.img"
            echo "   adb shell su -c \"dd if=/sdcard/fox.img of=/dev/block/by-name/boot_a\""
            echo "3. Reboot to recovery:"
            echo "   adb reboot recovery"
            echo "4. To return to HiOS: dd the saved stock_boot_a.img back to boot_a."
            echo ""
            echo "### Warnings"
            echo ""
            echo "- KI7's boot_a is only 32 MiB. This image $SIZE_STATUS."
            echo "- Read the repo README (flashing, asymmetric slots, repartition Option C) before touching anything."
            echo "- You are solely responsible for what you flash. Bootloader must be unlocked."
            echo ""
            echo "### Credits"
            echo ""
            echo "- Maintainer: **RohanDaCoder**"
            echo "- KH7n OrangeFox tree: isus203 / tecno-mt6768"
            echo "- twrpdtgen: SebaUbuntu - TWRP & OrangeFox teams"
          } > release_notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release for $TAG already exists - uploading assets (clobber)"
            gh release upload "$TAG" OrangeFox-unofficial-KI7.img \
              OrangeFox-unofficial-KI7.img.md5 *.zip \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OrangeFox R12.1 - TECNO Spark 10 Pro (KI7) - $TAG" \
              --notes-file release_notes.md \
              --latest \
              OrangeFox-unofficial-KI7.img OrangeFox-unofficial-KI7.img.md5 *.zip
          fi
          echo "Release $TAG published."
